<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Study Desk</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f6f7f5;color:#17201c;font:15px "Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;border-radius:16px;-webkit-app-region:drag;user-select:none}
@media(prefers-color-scheme:dark){body{background:#0f1412;color:#e6ece9}}
svg{width:84px;height:84px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.01em;animation:fade .5s .15s both}
p{margin:0;color:#6c7771;font-size:13px;animation:fade .5s .25s both}
.bar{width:120px;height:3px;border-radius:3px;background:rgba(31,111,92,.15);overflow:hidden;margin-top:6px}
.bar i{display:block;width:40%;height:100%;background:#1f6f5c;border-radius:3px;animation:load 1s ease-in-out infinite}
.arc{stroke-dasharray:1263;stroke-dashoffset:1263;animation:arc .9s .1s ease-out forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes arc{to{stroke-dashoffset:0}}
</style></head><body>
<svg viewBox="100 100 824 824" aria-hidden="true">
 <defs><linearGradient id="g" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2a8a72"/><stop offset="1" stop-color="#145446"/></linearGradient></defs>
 <rect x="100" y="100" width="824" height="824" rx="96" fill="url(#g)"/>
 <circle cx="512" cy="512" r="268" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="58"/>
 <path class="arc" d="M512 244A268 268 0 1 1 244 512" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round"/>
 <path d="M362 430l134 24v162l-134-24zM662 430l-134 24v162l134-24z" fill="#fff"/>
</svg>
<h1>Study Desk</h1>
<p>Getting your desk ready</p>
<div class="bar"><i></i></div>
</body></html>
